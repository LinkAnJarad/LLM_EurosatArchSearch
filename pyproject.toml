[project]
name = "archsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
